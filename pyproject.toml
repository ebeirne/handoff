[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "handoff-check"
version = "0.1.0"
description = "Self-hosted acceptance checks for robot training video: write what usable means, run it where the data lives."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
hands = ["mediapipe>=0.10.14"]
depth = ["pyliblzfse>=0.4"]
verify = ["cryptography>=42"]
dev = ["pytest>=8", "pyarrow>=15", "cryptography>=42"]
scan = ["torch>=2.2", "pyarrow>=15"]
fleet = ["mcap>=1.6", "mcap-ros2-support>=0.5", "pyarrow>=15"]

[project.scripts]
handoff = "handoff.cli:main"

[tool.setuptools.packages.find]
include = ["handoff*", "value*"]

[tool.setuptools.package-data]
handoff = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
